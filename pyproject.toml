[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuisle"
version = "0.1.0"
description = "Always-on macOS monitor for processes, connections, link health and throughput"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ptaylor" }]
keywords = ["macos", "network", "monitor", "processes", "throughput"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "click>=8.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
corewlan = [
    "pyobjc-framework-CoreWLAN>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreLocation>=10.0; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cuisle = "cuisle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuisle = ["dashboard.html", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
